  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    height: 100%;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  /* Overflow safety net: nothing should ever be wider than its container */
  img, svg, video, canvas {
    max-width: 100%;
    height: auto;
  }
  * {
    min-width: 0;
  }
  h1, h2, h3, p, span, div, button, label, input, textarea {
    overflow-wrap: break-word;
    word-break: break-word;
  }

  body {
    font-family: 'Urbanist', system-ui, sans-serif;
    font-weight: 500;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-style: normal;
    display: flex;
    justify-content: center;
  }

  b, strong, .label-main, .field-label, h2.section-title, .brand,
  .month-nav .label, .premium-banner .title, .stat-row span:last-child,
  .chip.active, .btn {
    font-weight: 700;
  }

  /* Fixed decorative backdrop: a simple high-contrast two-tone gradient per theme */
  .page-backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--page-bg);
    pointer-events: none;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    display: flex;
    flex-direction: column;
    background: transparent;
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
  }

  /* Small-phone breakpoint: trim padding/gaps and font sizes so
     the calendar grid and cards always have room to breathe
     without ever requiring horizontal scrolling. */
  @media (max-width: 360px) {
    main { padding: 14px 12px 134px; }
    .calendar-card { padding: 7px; }
    .cal-grid { gap: 4px; }
    .brand-center { font-size: 27px; }
    .brand { font-size: 28px; }
    .month-nav .label { font-size: clamp(16px, 5.5vw, 24px); }
  }

  .brand-center {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-style: normal;
    font-size: 34px;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    color: var(--brand-text);
    text-align: center;
    margin: 4px 0 18px;
  }
  .brand-center .brand-endo { margin-right: 7px; }
  .brand-center .brand-things { margin-left: 1px; }

  .brand {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-style: normal;
    font-size: 36px;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--brand-text);
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  main {
    flex: 1;
    padding: 18px 20px 138px;
  }

  h2.section-title {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-style: normal;
    font-size: 22px;
    margin: 0 0 6px;
  }

  p.section-sub {
    color: var(--text-dim);
    font-weight: 500;
    font-size: 14px;
    margin: 0 0 18px;
    line-height: 1.55;
  }

  /* ============ Calendar ============ */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }

  .calendar-card {
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    margin-top: 18px;
  }

  .month-nav button {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--accent);
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .month-nav .label {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-size: clamp(18px, 6vw, 30px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
    text-align: center;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 5px;
    width: 100%;
  }

  .cal-dow {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    padding-bottom: 8px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 22%;
    font-weight: 800;
    cursor: pointer;
    background: transparent;
    border: 1.5px solid var(--border);
    position: relative;
    padding-bottom: 18%;
    transition: transform 0.08s ease;
  }
  .cal-day:active { transform: scale(0.94); }

  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.today { border-color: var(--accent); border-width: 2px; }
  .cal-day.selected {
    background: transparent;
    color: var(--text);
    font-weight: 800;
    border-color: var(--accent);
    border-width: 2.5px;
  }
  .cal-day .day-num { line-height: 1; font-size: clamp(12px, 4vw, 17px); }
  .cal-day .marks-row {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 9%;
    max-width: 90%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 0;
  }
  .cal-day .marks-row .logged-heart { flex-shrink: 0; color: var(--title-color); }
  .cal-day .marks-row .logged-heart svg { display: block; width: 13px; height: 13px; }

  .cal-day.period-day {
    background: rgba(214, 69, 93, 0.16);
  }

  .app-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 0;
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.7;
    background: var(--bg);
  }
  .app-footer img { height: 14px; width: auto; display: block; }

  .flow-drop {
    width: 11px;
    height: 13px;
    display: inline-block;
    margin-right: 7px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .cal-day.fertile-day {
    box-shadow: inset 0 0 0 2px var(--fertile-color);
  }
  .cal-day.ovulation-day {
    box-shadow: inset 0 0 0 2.5px var(--ovulation-color);
    font-weight: 800;
  }

  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 14px 2px 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
  }
  .cal-legend .item { display: flex; align-items: center; gap: 6px; }
  .legend-heart-item { color: var(--title-color); font-size: 12px; }
  .legend-heart-item svg { width: 14px; height: 14px; display: block; }
  .cal-legend .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .empty-ribbon {
    width: 60px;
    height: 60px;
    margin: 0 auto 10px;
    opacity: 0.9;
    color: var(--accent);
  }
  .empty-ribbon svg { width: 100%; height: 100%; }

  /* ============ Cards & inputs ============ */
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-top: 16px;
  }

  .field-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: none;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: block;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 18px;
  }

  .chip {
    padding: 11px 16px;
    border-radius: 22px;
    border: 1.5px solid var(--border);
    background: var(--bg-elevated-2);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    user-select: none;
    min-height: 40px;
    display: flex;
    align-items: center;
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--btn-text);
    font-weight: 700;
  }

  .chip .chip-remove {
    margin-left: 8px;
    font-weight: 800;
    opacity: 0.6;
    line-height: 1;
  }
  .chip .chip-remove:active { opacity: 1; }

  textarea, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    background: var(--bg-elevated-2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    color: var(--text);
    font-family: inherit;
    font-weight: 500;
    font-size: 15px;
    margin-bottom: 18px;
  }
  textarea { min-height: 72px; resize: vertical; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row .label-main { font-size: 15px; font-weight: 700; }
  .toggle-row .label-sub {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .switch {
    position: relative;
    width: 50px;
    height: 30px;
    border-radius: 20px;
    background: var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  .switch.on { background: var(--accent); }
  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg-elevated);
    transition: transform 0.15s ease;
  }
  .switch.on .knob { transform: translateX(20px); background: var(--btn-text); }

  /* ============ Buttons ============ */
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--btn-text);
    border: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
    text-align: center;
    min-height: 48px;
  }
  .btn.secondary {
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--accent);
  }
  .btn.soft-lavender {
    background: #EDE3F7;
    color: #5B3E7A;
  }
  .btn.small {
    width: auto;
    padding: 10px 18px;
    font-size: 13.5px;
    min-height: 40px;
  }

  .theme-swatches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(94px, 100%), 1fr));
    gap: 12px;
    margin-bottom: 6px;
    width: 100%;
  }
  .theme-swatch {
    flex: 1;
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    font-style: italic;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--bg-elevated);
  }
  .theme-swatch.active { border-color: var(--accent); }

  /* ============ Bottom nav ============ */
  .bottom-fixed {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
  }
  nav.tabbar {
    background: #000000;
    border-top: 1px solid #262626;
    border-radius: 22px 22px 0 0;
    display: flex;
    padding: 12px 4px 16px;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: #8C8C8C;
    font-size: 10.5px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-family: inherit;
    padding: 6px 2px;
    min-height: 48px;
    border-radius: 14px;
  }
  nav.tabbar button.active { color: #FFFFFF; }
  nav.tabbar svg { width: 21px; height: 21px; }
  nav.tabbar button[data-tab="support"] svg { color: var(--title-color); }

  /* ============ Support tab ============ */
  .premium-banner {
    background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    color: var(--btn-text);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
  }
  .premium-banner .title {
    font-family: 'Urbanist', sans-serif;
    font-weight: 800;
    font-size: 19px;
    margin-bottom: 6px;
  }
  .premium-banner .sub {
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 16px;
    opacity: 0.9;
    line-height: 1.5;
  }
  .premium-feature-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .premium-feature-list li {
    font-size: 14px;
    line-height: 1.5;
  }
  .coffee-btn {
    display: block;
    background: var(--btn-text);
    color: var(--accent);
    text-decoration: none;
    border-radius: 999px;
    padding: 15px 20px;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    min-height: 48px;
  }

  .privacy-note {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .privacy-note svg { flex-shrink: 0; margin-top: 2px; width: 22px; height: 22px; color: var(--accent); }

  /* ============ Profile tab ============ */
  .avatar-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .avatar-circle {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--bg-elevated-2);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    color: var(--text-dim);
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-circle svg { width: 34px; height: 34px; }
  .field-grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14.5px;
    font-weight: 500;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-bar-bg {
    background: var(--bg-elevated-2);
    border-radius: 6px;
    height: 9px;
    flex: 1;
    margin: 0 12px;
    overflow: hidden;
  }
  .stat-bar-fill { background: var(--accent); height: 100%; border-radius: 6px; }

  .empty-note {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    padding: 34px 12px;
    line-height: 1.6;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: flex-end;
    z-index: 50;
  }
  .modal-sheet {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px 34px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-close {
    background: var(--bg-elevated-2);
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    float: right;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--btn-text);
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 700;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  /* ============ Splash screen ============ */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 999;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.5s ease;
  }
  #splashScreen.hide {
    opacity: 0;
    pointer-events: none;
  }
  #splashScreen .splash-tap-hint {
    color: rgba(0,0,0,0.45);
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 28px;
    letter-spacing: 0.3px;
  }
</style>
</head>

<script>
// Standalone storage: this app saves data using the browser's own storage,
// so it works fully on its own once hosted anywhere (Netlify, GitHub Pages, etc.)
// — no dependency on Claude at all. Data lives on the device it's used on.
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return { keys };
  }
};

const CONDITIONS = {
  endo: { label: "Endometriosis" },
  adeno: { label: "Adenomyosis" },
  fibroids: { label: "Fibroids" }
};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

const SYMPTOMS_BASE = [
  "Pelvic pain", "Bloating", "Fatigue", "Feeling sick", "Nausea", "Back pain", "Leg pain",
  "Bowel pain", "Bladder pain", "Headache"
];
const SYMPTOMS_BY_CONDITION = {
  adeno: ["Heavy periods", "Pelvic pressure"],
  fibroids: ["Heavy/prolonged bleeding", "Pressure or bulk feeling"]
};

const MOODS = ["Angry", "Low", "Normal", "Anxious", "Emotional", "Sleepy", "Stressed", "Wiped out"];

const ENDO_STAGES = [
  { key: "1", label: "Stage I", sub: "Minimal" },
  { key: "2", label: "Stage II", sub: "Mild" },
  { key: "3", label: "Stage III", sub: "Moderate" },
  { key: "4", label: "Stage IV", sub: "Severe" }
];

const MENOPAUSE_STATUSES = [
  "Not applicable", "Perimenopause", "Menopause (natural)", "Menopause (surgical)"
];

// Detects whether the app is running as the installed Android (Play Store / TWA) app,
// vs. a regular browser or "Add to Home Screen" web install. PWABuilder should set the
// packaged app's start_url to "./index.html?twa=1" so this stays reliable.
function isAndroidApp() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get("twa") === "1") return true;
  } catch (e) {}
  try {
    if (document.referrer && document.referrer.startsWith("android-app://")) return true;
  } catch (e) {}
  return false;
}

const SURGERY_TYPES = [
  "Diagnostic laparoscopy", "Excision surgery", "Ablation surgery",
  "Hysterectomy", "Oophorectomy", "C-section", "Bowel resection",
  "Tubal ligation (cut & burn)", "Tubal ligation (clip)", "Tubal ligation (ring/band)",
  "Salpingectomy (tube removal)", "Other"
];

const RECOVERY_SYMPTOMS = [
  "Mild pain", "Moderate pain", "Severe pain", "Fatigue", "Nausea",
  "Dizziness", "Swelling", "Numbness", "Bleeding/discharge", "Mood changes", "Other"
];

const THEMES = {
  "gold": { name: "Golden Glow", accent: "#8A6D00" },
  "sage": { name: "Soothing Sage", accent: "#12724A" },
  "winter": { name: "Rest & Restore", accent: "#0B6FA8" },
  "mono": { name: "Sensory Silence", accent: "#121212" },
  "blush": { name: "Calm Comfort", accent: "#7A3FA0" }
};

const DOW = ["S","M","T","W","T","F","S"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let state = {
  settings: { colorFamily: "gold", menstruates: true, conditions: [], customConditions: [], stage: null, premium: false, cycleLength: 28, periodLength: 5, menopauseStatus: "Not applicable", appLockPin: null },
  view: "calendar",
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  selectedDate: fmtDate(new Date()),
  entries: {},
  surgeries: {},
  dayModalOpen: false
};

function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

async function loadSettings() {
  try {
    const r = await window.storage.get("settings", false);
    if (r && r.value) state.settings = { ...state.settings, ...JSON.parse(r.value) };
  } catch (e) { /* first run, no settings yet */ }
  // migrate old single-"theme" format to colorFamily
  if (state.settings.theme && !state.settings.colorFamily) {
    const known = ["gold", "sage", "winter", "mono"];
    const t = state.settings.theme;
    state.settings.colorFamily = known.includes(t) ? t : (t.includes("-") ? t.split("-")[0] : "gold");
    delete state.settings.theme;
  }
  if (!state.settings.colorFamily) state.settings.colorFamily = "gold";
  delete state.settings.mode;
  if (!state.settings.periodLength) state.settings.periodLength = 5;
  if (!state.settings.customConditions) state.settings.customConditions = [];
  if (!state.settings.menopauseStatus) state.settings.menopauseStatus = "Not applicable";
}

async function saveSettings() {
  try { await window.storage.set("settings", JSON.stringify(state.settings), false); }
  catch (e) { console.error("save settings failed", e); }
}

async function loadEntry(dateKey) {
  try {
    const r = await window.storage.get("entry:" + dateKey, false);
    if (r && r.value) return { intimacy: false, protection: null, flow: "", appointment: false, appointmentNote: "", medicationTaken: false, surgeryScheduled: false, surgeryNote: "", ...JSON.parse(r.value) };
  } catch (e) {}
  return { symptoms: [], moods: [], notes: "", medicine: "", medicationTaken: false, period: false, flow: "", intimacy: false, protection: null, appointment: false, appointmentNote: "", surgeryScheduled: false, surgeryNote: "" };
}

async function saveEntry(dateKey, entry) {
  state.entries[dateKey] = entry;
  try { await window.storage.set("entry:" + dateKey, JSON.stringify(entry), false); }
  catch (e) { console.error("save entry failed", e); }
}

async function loadAllEntriesForMonth(year, month) {
  try {
    const listing = await window.storage.list("entry:", false);
    if (!listing || !listing.keys) return;
    for (const k of listing.keys) {
      const dateKey = k.replace("entry:", "");
      const [y,m] = dateKey.split("-").map(Number);
      if (y === year && m === month + 1 && !state.entries[dateKey]) {
        state.entries[dateKey] = await loadEntry(dateKey);
      }
    }
  } catch (e) {}
}

async function loadAllSurgeries() {
  try {
    const listing = await window.storage.list("surgery:");
    if (!listing || !listing.keys) return;
    for (const k of listing.keys) {
      const id = k.replace("surgery:", "");
      if (!state.surgeries[id]) {
        const r = await window.storage.get(k);
        if (r && r.value) state.surgeries[id] = JSON.parse(r.value);
      }
    }
  } catch (e) {}
}

async function saveSurgery(id, surgery) {
  state.surgeries[id] = surgery;
  try { await window.storage.set("surgery:" + id, JSON.stringify(surgery)); }
  catch (e) { console.error("save surgery failed", e); }
}

async function deleteSurgery(id) {
  delete state.surgeries[id];
  try { await window.storage.delete("surgery:" + id); } catch (e) {}
}

async function renderMain() {
  const main = document.getElementById("main");
  if (state.view === "calendar") { await renderCalendar(main); }
  else if (state.view === "profile") { await renderProfile(main); }
  else if (state.view === "stats") { await renderStats(main); }
  else if (state.view === "support") { isAndroidApp() ? renderPremium(main) : renderSupport(main); }
  else if (state.view === "settings") { renderSettingsView(main); }
}

async function getCycleStats() {
  if (!state.settings.menstruates) return null;
  let periodDates = [];
  try {
    const listing = await window.storage.list("entry:");
    for (const k of (listing.keys || [])) {
      const dateKey = k.replace("entry:", "");
      const entry = state.entries[dateKey] || await loadEntry(dateKey);
      state.entries[dateKey] = entry;
      if (entry.period) periodDates.push(dateKey);
    }
  } catch (e) { return null; }
  if (periodDates.length === 0) return null;
  periodDates.sort();

  let lastStart = periodDates[periodDates.length - 1];
  for (let i = periodDates.length - 1; i > 0; i--) {
    const cur = new Date(periodDates[i]);
    const prev = new Date(periodDates[i - 1]);
    const diffDays = Math.round((cur - prev) / 86400000);
    if (diffDays === 1) { lastStart = periodDates[i - 1]; } else break;
  }

  const cycleLength = state.settings.cycleLength || 28;
  const periodLength = state.settings.periodLength || 5;
  const start = new Date(lastStart + "T00:00:00");
  const today = new Date(fmtDate(new Date()) + "T00:00:00");
  const todayStr = fmtDate(today);
  const cycleDay = Math.round((today - start) / 86400000) + 1;

  const nextPeriod = new Date(start); nextPeriod.setDate(nextPeriod.getDate() + cycleLength);
  const daysUntilNext = Math.round((nextPeriod - today) / 86400000);

  const ovulation = new Date(nextPeriod); ovulation.setDate(ovulation.getDate() - 14);
  const fertileStart = new Date(ovulation); fertileStart.setDate(fertileStart.getDate() - 5);
  const fertileEnd = new Date(ovulation); fertileEnd.setDate(fertileEnd.getDate() + 1);

  const periodEndDate = new Date(start); periodEndDate.setDate(periodEndDate.getDate() + periodLength - 1);
  const fertileStartStr = fmtDate(fertileStart);
  const fertileEndStr = fmtDate(fertileEnd);
  const periodEndStr = fmtDate(periodEndDate);

  let phase;
  if (todayStr <= periodEndStr) phase = "Menstrual";
  else if (todayStr >= fertileStartStr && todayStr <= fertileEndStr) phase = "Ovulation";
  else if (todayStr < fertileStartStr) phase = "Follicular";
  else phase = "Luteal";

  return {
    lastStart, cycleDay, cycleLength, periodLength, phase,
    nextPeriod: fmtDate(nextPeriod), daysUntilNext,
    ovulation: fmtDate(ovulation),
    fertileStart: fertileStartStr, fertileEnd: fertileEndStr
  };
}

async function renderCalendar(main) {
  await loadAllEntriesForMonth(state.calYear, state.calMonth);
  const first = new Date(state.calYear, state.calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const todayKey = fmtDate(new Date());
  const cycleStats = await getCycleStats();

  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateKey = state.calYear + "-" + String(state.calMonth+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const entry = state.entries[dateKey];
    const hasAnything = entry && (entry.symptoms.length || entry.moods.length || entry.notes || entry.medicine || entry.medicationTaken || entry.surgeryScheduled || entry.period || entry.intimacy || entry.appointment);
    const isPeriod = entry && entry.period;
    let cls = "cal-day";
    if (dateKey === todayKey) cls += " today";
    if (dateKey === state.selectedDate) cls += " selected";
    if (isPeriod) cls += " period-day";
    if (cycleStats && dateKey >= cycleStats.fertileStart && dateKey <= cycleStats.fertileEnd) cls += " fertile-day";
    if (cycleStats && dateKey === cycleStats.ovulation) cls += " ovulation-day";
    const marks = hasAnything ? '<span class="logged-heart">' + iconHeart() + '</span>' : '';
    cells += `<div class="${cls}" data-date="${dateKey}"><span class="day-num">${d}</span>${marks ? '<span class="marks-row">' + marks + '</span>' : ''}</div>`;
  }

  main.innerHTML = `
    <div class="calendar-wrap">
    <div class="brand-center"><span class="brand-endo">Endo</span>${iconRibbon()}<span class="brand-things">Things</span></div>
    <p class="section-sub" style="margin-top:-4px; font-style:italic;">Your gentle space to track symptoms, flares, and healing — day by day.</p>
    <div class="calendar-card">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="label">${MONTHS[state.calMonth]} ${state.calYear}</div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid">
      ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join("")}
      ${cells}
    </div>
    </div>
    ${state.settings.menstruates ? `
    <div class="cal-legend">
      <div class="item"><span class="swatch" style="background:rgba(214, 69, 93, 0.16); box-shadow:inset 0 0 0 1.5px var(--period-color);"></span>Period</div>
      <div class="item"><span class="swatch" style="background:transparent; box-shadow:inset 0 0 0 2px var(--fertile-color);"></span>Fertile window</div>
      <div class="item"><span class="swatch" style="background:transparent; box-shadow:inset 0 0 0 2px var(--ovulation-color);"></span>Ovulation</div>
      <div class="item legend-heart-item">${iconHeart()}<span style="color:var(--text-dim); margin-left:4px;">Something logged that day</span></div>
    </div>
    ` : ''}
    <button class="btn secondary small" id="logApptBtn" style="margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px;">${iconMedical()} Log a medical appointment</button>
    ${state.settings.menstruates ? renderCycleCard(cycleStats) : ''}
    </div>
  `;

  main.querySelector("#prevMonth").onclick = () => {
    state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
    renderMain();
  };
  main.querySelector("#nextMonth").onclick = () => {
    state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
    renderMain();
  };
  main.querySelectorAll(".cal-day[data-date]").forEach(el => {
    el.onclick = async () => {
      state.selectedDate = el.dataset.date;
      await openDayModal(state.selectedDate);
    };
  });
  const logApptBtn = main.querySelector("#logApptBtn");
  if (logApptBtn) {
    logApptBtn.onclick = async () => {
      state.selectedDate = todayKey;
      await openDayModal(todayKey, true);
    };
  }
}

function renderCycleCard(stats) {
  if (!stats) {
    return `
      <div class="calendar-card">
        <span class="field-label">My Cycle</span>
        <p class="section-sub" style="margin-bottom:0;">Log a period day on the calendar to start seeing your cycle day, current phase, predicted next period, and fertility window here.</p>
      </div>
    `;
  }
  const overdue = stats.daysUntilNext < 0;
  return `
    <div class="calendar-card">
      <span class="field-label">My Cycle</span>
      <div class="stat-row"><span>Cycle day</span><span>${stats.cycleDay}</span></div>
      <div class="stat-row"><span>Phase</span><span>${stats.phase}</span></div>
      <div class="stat-row">
        <span>${overdue ? "Period may be late" : "Next period expected"}</span>
        <span>${overdue ? Math.abs(stats.daysUntilNext) + " day" + (Math.abs(stats.daysUntilNext)===1?"":"s") + " late" : "in " + stats.daysUntilNext + " day" + (stats.daysUntilNext===1?"":"s")}</span>
      </div>
      <div class="stat-row" style="border-bottom:none;">
        <span>Fertility window</span>
        <span>${stats.fertileStart} – ${stats.fertileEnd}</span>
      </div>
      <p class="section-sub" style="margin-top:10px; margin-bottom:0;">Estimated from your logged period days, average cycle length, and average period length — adjust these in Settings for more accurate predictions.</p>
    </div>
  `;
}

        </div>
        <span class="field-label" style="margin-top:10px;">Period start date</span>

      </div>

      <div class="toggle-row" style="border:none;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:var(--intimacy-color);">${iconDoubleHeart()}</span>
          <div>
            <div class="label-main">Intimacy</div>
            <div class="label-sub">Note if you were intimate today</div>
          </div>
        </div>
        <div class="switch ${entry.intimacy ? 'on' : ''}" id="intimacyToggle"><div class="knob"></div></div>
      </div>
      <div id="protectionSection" style="${entry.intimacy ? '' : 'display:none;'}">
        <span class="field-label">Protection used?</span>
        <div class="chip-row" id="protectionChips">
          <div class="chip ${entry.protection===true?'active':''}" data-p="yes">Yes</div>
          <div class="chip ${entry.protection===false?'active':''}" data-p="no">No</div>
        </div>
      </div>

      <div class="toggle-row" style="border:none;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:var(--appt-color);">${iconMedical()}</span>
          <div>
            <div class="label-main">Medical appointment</div>
            <div class="label-sub">Log a doctor visit or procedure on this date</div>
          </div>
        </div>
        <div class="switch ${entry.appointment ? 'on' : ''}" id="apptToggle"><div class="knob"></div></div>
      </div>
      <div id="apptNoteSection" style="${entry.appointment ? '' : 'display:none;'}">
        <span class="field-label">Appointment details</span>
        <input type="text" id="apptNoteField" value="${entry.appointmentNote || ''}" placeholder="e.g. Dr. Patel, 2pm, follow-up scan">

      <div class="toggle-row" style="border:none;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:var(--pill-color);">${iconPill()}</span>
          <div>
            <div class="label-main">Medication</div>
            <div class="label-sub">Log any medicine or treatment taken</div>
          </div>
        </div>
        <div class="switch ${entry.medicationTaken ? 'on' : ''}" id="medToggle"><div class="knob"></div></div>
      </div>
      <div id="medDetailSection" style="${entry.medicationTaken ? '' : 'display:none;'}">
        <span class="field-label">Medicine / treatment taken</span>
        <input type="text" id="medField" value="${entry.medicine || ''}" placeholder="e.g. ibuprofen, heat pad, hormone therapy">

      <div class="toggle-row" style="border:none;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:var(--surgery-color);">${iconMedicalAlert()}</span>

          </div>
        </div>
        <div class="switch ${entry.surgeryScheduled ? 'on' : ''}" id="surgeryToggle"><div class="knob"></div></div>
      </div>
      <div id="surgeryNoteSection" style="${entry.surgeryScheduled ? '' : 'display:none;'}">
        <span class="field-label">Surgery details</span>
        <input type="text" id="surgeryNoteField" value="${entry.surgeryNote || ''}" placeholder="e.g. Excision surgery, Dr. Nwosu, 7am">
      </div>

      <span class="field-label">Notes</span>
      <textarea id="notesField" placeholder="Anything else worth remembering">${entry.notes || ''}</textarea>

      <button class="btn" id="saveDayBtn">Save entry</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const periodToggle = overlay.querySelector("#periodToggle");
  const intimacyToggle = overlay.querySelector("#intimacyToggle");
  const protectionSection = overlay.querySelector("#protectionSection");
  const flowChipsRow = overlay.querySelector("#flowChips");
  const flowSection = overlay.querySelector("#flowSection");
  const apptToggle = overlay.querySelector("#apptToggle");
  const apptNoteSection = overlay.querySelector("#apptNoteSection");
  const medToggle = overlay.querySelector("#medToggle");
  const medDetailSection = overlay.querySelector("#medDetailSection");
  const surgeryToggle = overlay.querySelector("#surgeryToggle");
  const surgeryNoteSection = overlay.querySelector("#surgeryNoteSection");

  // Marks every day in [startStr, endStr] (inclusive) as a period day, tagging
  // each with the same start/end so reopening any day in the range shows it.
  // Does not touch the currently-open date — that's saved separately — and
  // never overwrites anything else already logged on those other days.
  async function applyPeriodRange(startStr, endStr, flow) {
    if (!startStr || !endStr) return;
    let start = new Date(startStr + "T00:00:00");
    let end = new Date(endStr + "T00:00:00");
    if (start > end) { const t = start; start = end; end = t; }
    const maxDays = 60;
    let count = 0;
    for (let d = new Date(start); d <= end && count < maxDays; d.setDate(d.getDate() + 1), count++) {
      const key = fmtDate(d);
      if (key === dateKey) continue;
      const existing = state.entries[key] || await loadEntry(key);
      existing.period = true;
      existing.flow = flow || existing.flow;
      existing.periodStart = startStr;
      existing.periodEnd = endStr;
      await saveEntry(key, existing);
    }
  }

  // Builds the entry from the modal's current state and writes it immediately —
  // called on every toggle/chip tap so nothing is lost if the modal is closed
  // via the X or a tap outside, instead of only on the explicit Save button.
  async function persistEntry() {
    const protChip = overlay.querySelector("#protectionChips .chip.active");
    const flowChip = overlay.querySelector("#flowChips .chip.active");
    const isPeriodOn = periodToggle ? periodToggle.classList.contains("on") : false;
    const isApptOn = apptToggle.classList.contains("on");
    const isMedOn = medToggle.classList.contains("on");
    const isSurgeryOn = surgeryToggle.classList.contains("on");
    const periodStartField = overlay.querySelector("#periodStartField");
    const periodEndField = overlay.querySelector("#periodEndField");
    const flow = flowChip ? flowChip.dataset.flow : "";
    const newEntry = {
      period: isPeriodOn,
      flow: isPeriodOn ? flow : "",
      periodStart: isPeriodOn && periodStartField ? periodStartField.value : "",
      periodEnd: isPeriodOn && periodEndField ? periodEndField.value : "",
      symptoms: [...overlay.querySelectorAll("#symptomChips .chip.active")].map(c => c.dataset.s),
      moods: [...overlay.querySelectorAll("#moodChips .chip.active")].map(c => c.dataset.m),
      medicine: isMedOn ? overlay.querySelector("#medField").value : "",
      medicationTaken: isMedOn,
      notes: overlay.querySelector("#notesField").value,
      intimacy: intimacyToggle.classList.contains("on"),
      protection: intimacyToggle.classList.contains("on") ? (protChip ? protChip.dataset.p === "yes" : null) : null,
      appointment: isApptOn,
      appointmentNote: isApptOn ? overlay.querySelector("#apptNoteField").value : "",
      surgeryScheduled: isSurgeryOn,
      surgeryNote: isSurgeryOn ? overlay.querySelector("#surgeryNoteField").value : ""
    };
    await saveEntry(dateKey, newEntry);
    if (isPeriodOn && periodStartField && periodEndField) {
      await applyPeriodRange(periodStartField.value, periodEndField.value, flow);
    }
    renderMain();
  }

  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  if (periodToggle) {
    periodToggle.onclick = () => {
      periodToggle.classList.toggle("on");
      if (flowSection) flowSection.style.display = periodToggle.classList.contains("on") ? "" : "none";
      persistEntry();
    };
  }

  medToggle.onclick = () => {
    medToggle.classList.toggle("on");
    medDetailSection.style.display = medToggle.classList.contains("on") ? "" : "none";
    persistEntry();
  };

  overlay.querySelectorAll("#symptomChips .chip").forEach(c => {
    c.onclick = () => { c.classList.toggle("active"); persistEntry(); };
  });
  overlay.querySelectorAll("#moodChips .chip").forEach(c => {
    c.onclick = () => { c.classList.toggle("active"); persistEntry(); };
  });

  intimacyToggle.onclick = () => {
    intimacyToggle.classList.toggle("on");
    protectionSection.style.display = intimacyToggle.classList.contains("on") ? "" : "none";
    persistEntry();
  };
  overlay.querySelectorAll("#protectionChips .chip").forEach(c => {
    c.onclick = () => {
      overlay.querySelectorAll("#protectionChips .chip").forEach(x => x.classList.remove("active"));
      c.classList.add("active");
      persistEntry();
    };
  });

  if (flowChipsRow) {
    flowChipsRow.querySelectorAll(".chip").forEach(c => {
      c.onclick = () => {
        flowChipsRow.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        persistEntry();
      };
    });
  }

  apptToggle.onclick = () => {
    apptToggle.classList.toggle("on");
    apptNoteSection.style.display = apptToggle.classList.contains("on") ? "" : "none";
    persistEntry();
  };
  if (focusAppointment) {
    setTimeout(() => apptToggle.scrollIntoView({ block: "center", behavior: "smooth" }), 50);
  }

  surgeryToggle.onclick = () => {
    surgeryToggle.classList.toggle("on");
    surgeryNoteSection.style.display = surgeryToggle.classList.contains("on") ? "" : "none";
    persistEntry();
  };

  overlay.querySelector("#saveDayBtn").onclick = async () => {
    const protChip = overlay.querySelector("#protectionChips .chip.active");
    const flowChip = overlay.querySelector("#flowChips .chip.active");
    const isPeriodOn = periodToggle ? periodToggle.classList.contains("on") : false;
    const isApptOn = apptToggle.classList.contains("on");
    const isMedOn = medToggle.classList.contains("on");
    const isSurgeryOn = surgeryToggle.classList.contains("on");
    const periodStartField = overlay.querySelector("#periodStartField");
    const periodEndField = overlay.querySelector("#periodEndField");
    const flow = flowChip ? flowChip.dataset.flow : "";
    const newEntry = {
      period: isPeriodOn,
      flow: isPeriodOn ? flow : "",
      periodStart: isPeriodOn && periodStartField ? periodStartField.value : "",
      periodEnd: isPeriodOn && periodEndField ? periodEndField.value : "",
      symptoms: [...overlay.querySelectorAll("#symptomChips .chip.active")].map(c => c.dataset.s),
      moods: [...overlay.querySelectorAll("#moodChips .chip.active")].map(c => c.dataset.m),
      medicine: isMedOn ? overlay.querySelector("#medField").value : "",
      medicationTaken: isMedOn,
      notes: overlay.querySelector("#notesField").value,
      intimacy: intimacyToggle.classList.contains("on"),
      protection: intimacyToggle.classList.contains("on") ? (protChip ? protChip.dataset.p === "yes" : null) : null,
      appointment: isApptOn,
      appointmentNote: isApptOn ? overlay.querySelector("#apptNoteField").value : "",
      surgeryScheduled: isSurgeryOn,
      surgeryNote: isSurgeryOn ? overlay.querySelector("#surgeryNoteField").value : ""
    };
    await saveEntry(dateKey, newEntry);
    if (isPeriodOn && periodStartField && periodEndField) {
      await applyPeriodRange(periodStartField.value, periodEndField.value, flow);
    }
    overlay.remove();
    showToast("Entry saved");
    renderMain();
  };
}

        <div class="chip" id="addConditionChip">+ Add condition</div>
      </div>
      <div id="addConditionRow" style="display:none; margin-top:10px;">
        <input type="text" id="newConditionField" placeholder="e.g. PCOS, IBS, migraines">
        <button class="btn secondary small" id="saveConditionBtn">Add condition</button>
      </div>
      <p class="section-sub" style="margin-bottom:0;">This adjusts which symptoms show up when you log a day.</p>
    </div>

    <div id="surgeriesContainer"></div>
  `;

  const avatarBtn = main.querySelector("#avatarBtn");
  const avatarInput = main.querySelector("#avatarInput");
  const avatarRemoveBtn = main.querySelector("#avatarRemoveBtn");
  if (avatarBtn) avatarBtn.onclick = () => avatarInput.click();
  if (avatarRemoveBtn) {
    avatarRemoveBtn.onclick = async () => {
      s.avatar = "";
      await saveSettings();
      renderProfile(main);
    };
  }
  if (avatarInput) {
    avatarInput.onchange = () => {
      const file = avatarInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rawDataUrl = reader.result;

        const finishSave = async (dataUrl) => {
          const previous = s.avatar;
          s.avatar = dataUrl;
          const result = await window.storage.set("settings", JSON.stringify(s), false).catch(() => null);
          if (!result) {
            s.avatar = previous;
            showToast("Couldn't save that photo — try a smaller image");
          }
          renderProfile(main);
        };

        // Try to downscale/compress for more reliable storage. If anything
        // about that pipeline fails (canvas quirks, unsupported format,
        // etc.), fall back to saving the original photo as-is so adding a
        // picture always works even when compression can't run.
        try {
          const img = new Image();
          img.onload = () => {
            try {
              const maxDim = 480;
              const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              const compressed = canvas.toDataURL("image/jpeg", 0.82);
              finishSave(compressed);
            } catch (e) {
              finishSave(rawDataUrl);
            }
          };
          img.onerror = () => finishSave(rawDataUrl);
          img.src = rawDataUrl;
        } catch (e) {
          finishSave(rawDataUrl);
        }
      };
      reader.onerror = () => showToast("Couldn't read that photo — try another one");
      reader.readAsDataURL(file);
    };
  }

  const bindField = (id, key, parse) => {
    const el = main.querySelector("#" + id);
    if (!el) return;
    el.onchange = async () => {
      s[key] = parse ? parse(el.value) : el.value;
      await saveSettings();
    };
  };
  bindField("usernameField", "username");
  bindField("pronounsField", "pronouns");
  bindField("ageField", "age", v => v ? parseInt(v, 10) : "");
  bindField("heightField", "height");
  bindField("weightField", "weight");
  bindField("allergiesField", "allergies");

  main.querySelectorAll(".chip[data-stage]").forEach(chip => {
    chip.onclick = async () => {
      const key = chip.dataset.stage;
      s.stage = (s.stage === key) ? null : key;
      await saveSettings();
      renderProfile(main);
    };
  });

  main.querySelectorAll(".chip[data-c]").forEach(chip => {
    chip.onclick = async (e) => {
      const removeBtn = e.target.closest(".chip-remove");
      if (removeBtn) {
        e.stopPropagation();
        const label = removeBtn.dataset.remove;
        const key = "custom:" + label;
        s.customConditions = (s.customConditions || []).filter(l => l !== label);
        s.conditions = s.conditions.filter(k => k !== key);
        await saveSettings();
        renderProfile(main);
        return;
      }
      const key = chip.dataset.c;
      const idx = s.conditions.indexOf(key);
      if (idx >= 0) {
        s.conditions.splice(idx, 1);
      } else {
        s.conditions.push(key);
      }
      await saveSettings();
      renderProfile(main);
    };
  });

  const addConditionChip = main.querySelector("#addConditionChip");
  const addConditionRow = main.querySelector("#addConditionRow");
  const newConditionField = main.querySelector("#newConditionField");
  const saveConditionBtn = main.querySelector("#saveConditionBtn");
  if (addConditionChip) {
    addConditionChip.onclick = () => {
      const showing = addConditionRow.style.display !== "none";
      addConditionRow.style.display = showing ? "none" : "block";
      if (!showing) newConditionField.focus();
    };
  }
  async function addCustomCondition() {
    const label = newConditionField.value.trim();
    if (!label) return;
    const existingLabels = [...Object.values(CONDITIONS).map(c => c.label), ...(s.customConditions || [])];
    if (existingLabels.some(l => l.toLowerCase() === label.toLowerCase())) {
      showToast("That condition is already in your list");
      return;
    }
    if (!s.customConditions) s.customConditions = [];
    s.customConditions.push(label);
    const key = "custom:" + label;
    if (!s.conditions.includes(key)) s.conditions.push(key);
    await saveSettings();
    renderProfile(main);
  }
  if (saveConditionBtn) saveConditionBtn.onclick = addCustomCondition;
  if (newConditionField) {
    newConditionField.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); addCustomCondition(); }
    });
  }

  await renderSurgeries(main.querySelector("#surgeriesContainer"));
}

async function getTrendData(days) {
  const listing = await window.storage.list("entry:", false).catch(() => null);
  const keys = listing && listing.keys ? listing.keys : [];
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const counts = {};
  let totalLogged = 0;
  const symptomDates = [];
  for (const k of keys) {
    const dateKey = k.replace("entry:", "");
    const d = new Date(dateKey);
    if (isNaN(d) || d < cutoff) continue;
    const entry = state.entries[dateKey] || await loadEntry(dateKey);
    state.entries[dateKey] = entry;
    if (entry.symptoms.length) { totalLogged++; symptomDates.push({ date: d, symptoms: entry.symptoms }); }
    entry.symptoms.forEach(s => counts[s] = (counts[s]||0) + 1);
  }
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = sorted.length ? sorted[0][1] : 1;

  let insight = null;
  if (sorted.length && state.settings.menstruates) {
    const topSymptom = sorted[0][0];
    insight = `"${topSymptom}" was your most logged symptom over this period — worth mentioning at your next appointment if it's new or worsening.`;
  } else if (sorted.length) {
    insight = `"${sorted[0][0]}" came up most often over this period.`;
  }

  return { totalLogged, sorted, max, insight };
}

  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close">✕</button>
      <h2 class="section-title">${state.settings.appLockPin ? "Change PIN" : "Set a PIN"}</h2>
      <span class="field-label">Enter a 4-digit PIN</span>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" placeholder="••••">
      <span class="field-label">Confirm PIN</span>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinConfirm" placeholder="••••">
      <button class="btn soft-lavender" id="savePinBtn">Save PIN</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector(".modal-close").onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector("#savePinBtn").onclick = async () => {
    const pin = overlay.querySelector("#pinInput").value.trim();
    const confirmPin = overlay.querySelector("#pinConfirm").value.trim();
    if (!/^\d{4}$/.test(pin)) { showToast("PIN must be exactly 4 digits"); return; }
    if (pin !== confirmPin) { showToast("PINs don't match"); return; }
    state.settings.appLockPin = pin;
    await saveSettings();
    overlay.remove();
    showToast("PIN saved");
    renderMain();
  };
}

function renderSettingsView(main) {
  main.innerHTML = `
    <h2 class="section-title">Settings</h2>
    <p class="section-sub">Your data stays on this device.</p>

    <span class="field-label">Color theme</span>
    <div class="theme-swatches">
      ${Object.entries(THEMES).map(([key, t]) => `
        <div class="theme-swatch ${state.settings.colorFamily===key?'active':''}" data-family="${key}"
             style="background:var(--bg-elevated); color:var(--text); border-color:${state.settings.colorFamily===key ? t.accent : 'var(--border)'};">
          <div style="width:18px; height:18px; border-radius:50%; background:${t.accent}; margin:0 auto 6px;"></div>
          ${t.name}
        </div>
      `).join("")}
    </div>

    <div class="card">
      <div class="toggle-row" style="border:none; padding-top:0;">
        <div>
          <div class="label-main">I menstruate</div>
          <div class="label-sub">Turn off to hide cycle/period fields. Flare and symptom tracking always stays on.</div>
        </div>
        <div class="switch ${state.settings.menstruates?'on':''}" id="menstruateToggle"><div class="knob"></div></div>
      </div>
      ${state.settings.menstruates ? `
      <div style="margin-top:14px;">
        <span class="field-label">Average cycle length (days)</span>
        <input type="number" id="cycleLengthField" value="${state.settings.cycleLength || 28}" min="15" max="60">
      </div>
      <div>
        <span class="field-label">Average period length (days)</span>
        <input type="number" id="periodLengthField" value="${state.settings.periodLength || 5}" min="1" max="14">
      </div>
      ` : `
      <div style="margin-top:14px;">
        <span class="field-label">Menopause status</span>
        <div class="chip-row" id="menopauseChips">
          ${MENOPAUSE_STATUSES.map(m => `<div class="chip${state.settings.menopauseStatus===m ? ' active' : ''}" data-m="${m}">${m}</div>`).join("")}
        </div>
      </div>
      `}
    </div>

    <div class="card">
      <span class="field-label">Backup &amp; restore</span>
      <p class="section-sub">${isAndroidApp() ? "Your data lives only on this device — uninstalling the app, clearing its storage in Android's app settings, or switching devices will lose it unless you back it up first." : "Your data lives only on this device/browser — clearing browser data, switching browsers, or using a new device will lose it unless you back it up first."}
      <button class="btn secondary small" id="exportDataBtn" style="margin-right:8px;">Download backup</button>
      <button class="btn secondary small" id="importDataBtn">Restore from backup</button>
      <input type="file" id="importDataInput" accept="application/json,.json" style="display:none;">
    </div>

    <div class="card">
      <span class="field-label">Your data privacy</span>
      <div class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <p class="section-sub" style="margin-bottom:0;">Endo Things values your trust above all else. Every logged cycle date, symptom, and surgical record is stored 100% locally on this device and is never uploaded, tracked, or sold to third parties.</p>
      </div>
    </div>

    <div class="card">
      <span class="field-label">Resources</span>
      <p class="section-sub">Trusted places to learn more about endometriosis, diagnosis, and treatment.</p>
      <a href="https://www.mayoclinic.org/diseases-conditions/endometriosis/symptoms-causes/syc-20354656" target="_blank" rel="noopener" style="display:block; padding:10px 0; border-bottom:1px solid var(--border); color:var(--accent); font-weight:700; text-decoration:none;">Mayo Clinic — Endometriosis: Symptoms &amp; Causes ↗</a>
      <a href="https://endometriosisnetwork.com/" target="_blank" rel="noopener" style="display:block; padding:10px 0; color:var(--accent); font-weight:700; text-decoration:none;">The Endometriosis Network Canada ↗</a>
    </div>
  `;

  main.querySelectorAll(".theme-swatch").forEach(sw => {
    sw.onclick = async () => {
      state.settings.colorFamily = sw.dataset.family;
      await saveSettings();
      render();
    };
  });

  const mToggle = main.querySelector("#menstruateToggle");
  mToggle.onclick = async () => {
    state.settings.menstruates = !state.settings.menstruates;
    await saveSettings();
    render();
  };

  const cycleLengthField = main.querySelector("#cycleLengthField");
  if (cycleLengthField) {
    cycleLengthField.onchange = async () => {
      const val = parseInt(cycleLengthField.value, 10);
      state.settings.cycleLength = (val >= 15 && val <= 60) ? val : 28;
      await saveSettings();
    };
  }

  const periodLengthField = main.querySelector("#periodLengthField");
  if (periodLengthField) {
    periodLengthField.onchange = async () => {
      const val = parseInt(periodLengthField.value, 10);
      state.settings.periodLength = (val >= 1 && val <= 14) ? val : 5;
      await saveSettings();
    };
  }

  main.querySelectorAll("#menopauseChips .chip").forEach(chip => {
    chip.onclick = async () => {
      state.settings.menopauseStatus = chip.dataset.m;
      await saveSettings();
      render();
    };
  });

  const exportBtn = main.querySelector("#exportDataBtn");
  if (exportBtn) {
    exportBtn.onclick = async () => {
      try {
        const listing = await window.storage.list();
        const keys = (listing && listing.keys) || [];
        const data = {};
        for (const k of keys) {
          const r = await window.storage.get(k).catch(() => null);
          if (r && r.value !== undefined && r.value !== null) data[k] = r.value;
        }
        const payload = { app: "Endo Things", exportedAt: new Date().toISOString(), data };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "endo-things-backup-" + fmtDate(new Date()) + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast("Backup downloaded");
      } catch (e) {
        console.error("export failed", e);
        showToast("Couldn't create backup — try again");
      }
    };
  }

  const importBtn = main.querySelector("#importDataBtn");
  const importInput = main.querySelector("#importDataInput");
  if (importBtn && importInput) {
    importBtn.onclick = () => importInput.click();
    importInput.onchange = () => {
      const file = importInput.files[0];
      if (!file) return;
      const proceed = confirm("Restoring a backup will overwrite your current data on this device with the backup's data. Continue?");
      if (!proceed) { importInput.value = ""; return; }
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const payload = JSON.parse(reader.result);
          const data = payload && payload.data;
          if (!data || typeof data !== "object") throw new Error("bad format");
          for (const [key, value] of Object.entries(data)) {
            await window.storage.set(key, value);
          }
          state.entries = {};
          state.surgeries = {};
          await loadSettings();
          await loadAllSurgeries();
          showToast("Backup restored");
          render();
        } catch (e) {
          console.error("import failed", e);
          showToast("That file couldn't be read as a backup");
        }
      };
      reader.onerror = () => showToast("Couldn't read that file");
      reader.readAsText(file);
      importInput.value = "";
    };
  }
}

(async function init() {
  await loadSettings();
  render();

  if (state.settings.premium && state.settings.appLockPin) {
    showPinLockScreen();
  }

  const splash = document.getElementById("splashScreen");
  let dismissed = false;
  function dismissSplash() {
    if (dismissed) return;
    dismissed = true;
    splash.classList.add("hide");
    setTimeout(() => splash.remove(), 550);
  }
  splash.addEventListener("click", dismissSplash);
  setTimeout(dismissSplash, 2600);

  if (false && "serviceWorker" in navigator) {
    // Service worker removed for now — sw.js was getting blocked by email
    // providers during file transfer. Can revisit with a different transfer
    // method later if offline support becomes a priority.
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();

function showPinLockScreen() {
  const overlay = document.createElement("div");
  overlay.id = "pinLockScreen";
  overlay.style.cssText = "position:fixed; inset:0; z-index:998; background:var(--bg, #fdf6e3); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;";
  overlay.innerHTML = `
    <div style="font-family:'Urbanist',sans-serif; font-weight:800; font-size:20px;">Enter your PIN</div>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinLockInput" style="font-size:24px; letter-spacing:8px; text-align:center; width:140px; padding:10px; border-radius:12px; border:1.5px solid var(--border,#ccc);">
    <div id="pinLockError" style="color:var(--danger,#c0392b); font-size:13px; min-height:16px;"></div>
    <button class="btn soft-lavender" id="pinLockSubmit" style="max-width:200px;">Unlock</button>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector("#pinLockInput");
  const err = overlay.querySelector("#pinLockError");
  input.focus();
  function tryUnlock() {
    if (input.value === state.settings.appLockPin) {
      overlay.remove();
    } else {
      err.textContent = "Incorrect PIN, try again";
      input.value = "";
      input.focus();
    }
  }
  overlay.querySelector("#pinLockSubmit").onclick = tryUnlock;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
}
</script>
</body>
</html>
